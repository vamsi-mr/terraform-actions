name: Reusable-Workflow
on:
  workflow_call:
      inputs:
          working_directory:
              description: 'The working directory for the Terraform configuration'
              required: false
              type: string
              default: "."
          terraform_version:
            description: Terraform CLI version supplied by the caller
            required: true
            type: string
          aws_role_to_assume:
            description: AWS IAM role ARN to assume using GitHub OIDC
            required: true
            type: string
          aws_region:
            description: AWS region for credentials
            required: false
            type: string
            default: us-east-1
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:

      - name: checkout code
        uses: actions/checkout@v5

      - name: set up terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Initialize
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan
      
      - name: Run
        run: terraform apply -auto-approve

      - name: Destroy
        run: terraform destroy -auto-approve
        